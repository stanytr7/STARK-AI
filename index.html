
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK AI | Personal Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070711;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 7%;
    border-bottom: 1px solid #24203c;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #a855f7;
    text-shadow: 0 0 15px #8b5cf6;
}

.status {
    color: #38bdf8;
    font-size: 13px;
}

main {
    max-width: 950px;
    margin: 65px auto;
    padding: 20px;
    text-align: center;
}

.orb {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    margin: 0 auto 30px;
    background: radial-gradient(circle, #38bdf8, #7028d9, #100c28);
    box-shadow: 0 0 35px #7028d9, 0 0 70px #2563eb;
    animation: pulse 3s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(0.95); }
    to { transform: scale(1.08); }
}

h1 {
    font-size: clamp(35px, 7vw, 55px);
    margin-bottom: 15px;
}

h1 span {
    color: #a855f7;
}

.subtitle {
    color: #aaa9c1;
    margin-bottom: 35px;
}

.chat {
    background: #101020;
    border: 1px solid #31245b;
    border-radius: 18px;
    padding: 22px;
    text-align: left;
    box-shadow: 0 0 25px #29134c44;
}

.messages {
    height: 260px;
    overflow-y: auto;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message {
    padding: 13px 16px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.5;
}

.bot {
    background: #20183a;
    border-left: 3px solid #a855f7;
    align-self: flex-start;
}

.user {
    background: #142d4b;
    border-right: 3px solid #38bdf8;
    align-self: flex-end;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border-radius: 10px;
    background: #080817;
    color: white;
    border: 1px solid #49317b;
    outline: none;
}

input:focus {
    border-color: #38bdf8;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    background: linear-gradient(110deg, #7028d9, #2563eb);
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    box-shadow: 0 0 20px #7c3aed;
    transform: translateY(-2px);
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 12px;
}

@media(max-width: 500px) {
    header { padding: 18px 5%; }
    main { margin: 35px auto; }
    .chat { padding: 14px; }
    button { padding: 12px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">STARK AI</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

    <div class="orb"></div>

    <h1>HELLO, I'M <span>STARK</span></h1>

    <p class="subtitle">
        Your personal intelligent assistant.
        Ready to help you build something extraordinary.
    </p>

    <section class="chat">

        <div class="messages" id="messages">
            <div class="message bot">
                STARK: Hello! I am STARK AI.
                How can I assist you today?
            </div>
        </div>

        <div class="input-area">
            <input
                id="userInput"
                type="text"
                placeholder="Talk to STARK..."
                autocomplete="off"
            >
            <button onclick="sendMessage()">SEND</button>
        </div>

    </section>

</main>

<footer>
    STARK AI © 2026 | Personal Assistant Interface
</footer>

<script>
function sendMessage() {
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = "YOU: " + text;

    messages.appendChild(userMessage);

    input.value = "";

    const botMessage = document.createElement("div");
    botMessage.className = "message bot";

    if (/hello|hi|hey/i.test(text)) {
        botMessage.textContent = "STARK: Hello! Great to hear from you. What shall we work on?";
    } else if (/your name/i.test(text)) {
        botMessage.textContent = "STARK: I am STARK, your personal assistant.";
    } else if (/help/i.test(text)) {
        botMessage.textContent = "STARK: I can demonstrate basic chat interactions. My advanced AI connection is not installed yet.";
    } else {
        botMessage.textContent = "STARK: I received your message! My real AI intelligence connection is coming in the next development stage.";
    }

    messages.appendChild(botMessage);
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("userInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
